<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Capibara News</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #102630 0%, #1F4E5F 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
            color: #2C3E50;
        }
        .admin-container {
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .admin-header {
            background: linear-gradient(90deg, #102630, #1F4E5F);
            color: #fff;
            padding: 25px 30px;
            border-bottom: 4px solid #8BC34A;
        }
        .admin-header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .admin-header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #b0bec5;
        }
        .admin-body {
            padding: 30px;
        }
        /* LOGIN */
        .login-box {
            text-align: center;
            padding: 40px 20px;
        }
        .login-box h2 {
            color: #1F4E5F;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .login-input {
            width: 100%;
            max-width: 300px;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        .login-input:focus {
            border-color: #8BC34A;
        }
        .login-btn {
            background: #8BC34A;
            color: #113019;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #7cb342;
        }
        .login-error {
            color: #b91c1c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        /* PANEL PRINCIPAL */
        .panel-content {
            display: none;
        }
        .panel-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #1F4E5F;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #8BC34A;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
        }
        .checkbox-group input {
            width: auto;
            transform: scale(1.3);
        }
        .checkbox-group label {
            margin: 0;
            text-transform: none;
            font-weight: normal;
            font-size: 14px;
            color: #2C3E50;
            cursor: pointer;
        }
        .save-btn {
            background: #8BC34A;
            color: #113019;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .save-btn:hover {
            background: #7cb342;
        }
        .save-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .divider {
            height: 2px;
            background: #e2e8f0;
            margin: 30px 0;
        }
        .list-title {
            font-size: 18px;
            color: #1F4E5F;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .noticia-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #8BC34A;
            padding: 15px 18px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }
        .noticia-card.inactiva {
            border-left-color: #cbd5e1;
            opacity: 0.6;
        }
        .noticia-card-info {
            flex: 1;
            min-width: 0;
        }
        .noticia-card-titulo {
            font-weight: bold;
            color: #1F4E5F;
            font-size: 14px;
            margin: 0 0 5px 0;
            word-break: break-word;
        }
        .noticia-card-meta {
            font-size: 11px;
            color: #607D8B;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .noticia-card-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-mini {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-toggle {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .btn-toggle:hover {
            background: #e2e8f0;
        }
        .btn-toggle.activa {
            background: #dcfce7;
            color: #15803d;
            border-color: #22c55e;
        }
        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .btn-delete:hover {
            background: #fecaca;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
            padding: 20px;
            font-size: 14px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #113019;
            color: #8BC34A;
            padding: 15px 25px;
            border-radius: 6px;
            border-left: 4px solid #8BC34A;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.error {
            background: #7f1d1d;
            color: #fecaca;
            border-left-color: #ef4444;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .noticia-card {
                flex-direction: column;
            }
            .noticia-card-actions {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1>🐾 Panel de Administración</h1>
            <p>Capibara News · Gestión de Última Hora</p>
        </div>
        <div class="admin-body">

            <!-- LOGIN -->
            <div class="login-box" id="loginBox">
                <h2>🔐 Ingresá la contraseña</h2>
                <input type="password" id="passwordInput" class="login-input" placeholder="Contraseña" onkeypress="if(event.key==='Enter') login()">
                <br>
                <button class="login-btn" onclick="login()">Ingresar</button>
                <p class="login-error" id="loginError">❌ Contraseña incorrecta</p>
            </div>

            <!-- PANEL -->
            <div class="panel-content" id="panelContent">

                <h2 class="list-title">📝 Cargar Nueva Noticia</h2>

                <div class="form-group">
                    <label>Título de la noticia *</label>
                    <input type="text" id="inputTitulo" placeholder="Ej: La Corte Suprema habilitó la venta de tierras...">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Fuente *</label>
                        <input type="text" id="inputFuente" placeholder="Ej: Infobae">
                    </div>
                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="text" id="inputFecha" placeholder="Ej: 02/10/2026">
                    </div>
                </div>

                <div class="form-group">
                    <label>Resumen * (podés usar párrafos separados)</label>
                    <textarea id="inputResumen" placeholder="Escribí acá el resumen de la noticia..."></textarea>
                </div>

                <div class="form-group">
                    <label>Link a la fuente original *</label>
                    <input type="text" id="inputLink" placeholder="https://...">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="inputActiva" checked>
                    <label for="inputActiva">Publicar inmediatamente (activa)</label>
                </div>

                <button class="save-btn" id="saveBtn" onclick="guardarNoticia()">💾 Guardar Noticia</button>

                <div class="divider"></div>

                <h2 class="list-title">📋 Noticias Cargadas</h2>
                <div id="listaNoticias">
                    <p class="empty-state">Cargando noticias...</p>
                </div>

            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== CONFIGURACIÓN =====
        const PASSWORD = "Capibara20279090";
        const JSONBIN_BIN_ID = "6ac004cfac6210605a0d8d79";
        const JSONBIN_MASTER_KEY = "$2a$10$zkeii59rtk2z52jkinfqZeHLccW1evdcn7ni0/VR9RPE2YwrwzwMm";
        const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;
        // =========================

        // ===== LOGIN =====
        function login() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panelContent').classList.add('active');
                cargarNoticias();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // ===== TOAST =====
        function mostrarToast(mensaje, esError) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast show' + (esError ? ' error' : '');
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // ===== CARGAR NOTICIAS =====
        function cargarNoticias() {
            fetch(JSONBIN_URL + '/latest', {
                headers: {
                    'X-Master-Key': JSONBIN_MASTER_KEY
                }
            })
            .then(res => res.json())
            .then(data => {
                const noticias = (data.record && data.record.noticias) ? data.record.noticias : [];
                renderizarNoticias(noticias);
            })
            .catch(err => {
                console.error('Error cargando noticias:', err);
                document.getElementById('listaNoticias').innerHTML = '<p class="empty-state">Error al cargar las noticias.</p>';
            });
        }

        function renderizarNoticias(noticias) {
            const contenedor = document.getElementById('listaNoticias');
            if (noticias.length === 0) {
                contenedor.innerHTML = '<p class="empty-state">Todavía no hay noticias cargadas.</p>';
                return;
            }
            contenedor.innerHTML = '';
            noticias.slice().reverse().forEach((n, idx) => {
                const indexOriginal = noticias.length - 1 - idx;
                const card = document.createElement('div');
                card.className = 'noticia-card' + (n.activa ? '' : ' inactiva');
                card.innerHTML = `
                    <div class="noticia-card-info">
                        <p class="noticia-card-titulo">${escapeHtml(n.titulo)}</p>
                        <div class="noticia-card-meta">
                            📰 ${escapeHtml(n.fuente)} · 📅 ${escapeHtml(n.fecha)} · ${n.activa ? '✅ Activa' : '❌ Inactiva'}
                        </div>
                    </div>
                    <div class="noticia-card-actions">
                        <button class="btn-mini btn-toggle ${n.activa ? 'activa' : ''}" onclick="toggleNoticia(${indexOriginal})">
                            ${n.activa ? 'Activa' : 'Inactiva'}
                        </button>
                        <button class="btn-mini btn-delete" onclick="eliminarNoticia(${indexOriginal})">
                            🗑️
                        </button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        // ===== GUARDAR NOTICIA =====
        function guardarNoticia() {
            const titulo = document.getElementById('inputTitulo').value.trim();
            const fuente = document.getElementById('inputFuente').value.trim();
            const fecha = document.getElementById('inputFecha').value.trim();
            const resumen = document.getElementById('inputResumen').value.trim();
            const link = document.getElementById('inputLink').value.trim();
            const activa = document.getElementById('inputActiva').checked;

            if (!titulo || !fuente || !fecha || !resumen || !link) {
                mostrarToast('❌ Completá todos los campos obligatorios', true);
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Guardando...';

            // Convertir resumen (texto plano con saltos de línea) a párrafos HTML
            const resumenHTML = resumen
                .split(/\n\s*\n/)
                .filter(p => p.trim())
                .map(p => '<p>' + escapeHtml(p.trim()) + '</p>')
                .join('');

            // Leer noticias actuales y agregar la nueva
            fetch(JSONBIN_URL + '/latest', {
                headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
            })
            .then(res => res.json())
            .then(data => {
                const noticias = (data.record && data.record.noticias) ? data.record.noticias : [];
                noticias.push({
                    id: 'noticia-' + Date.now(),
                    titulo: titulo,
                    fuente: fuente,
                    fecha: fecha,
                    resumen: resumenHTML,
                    link: link,
                    activa: activa
                });

                return fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify({ noticias: noticias })
                });
            })
            .then(res => res.json())
            .then(data => {
                mostrarToast('✅ Noticia guardada con éxito');
                // Limpiar formulario
                document.getElementById('inputTitulo').value = '';
                document.getElementById('inputFuente').value = '';
                document.getElementById('inputFecha').value = '';
                document.getElementById('inputResumen').value = '';
                document.getElementById('inputLink').value = '';
                document.getElementById('inputActiva').checked = true;
                btn.disabled = false;
                btn.textContent = '💾 Guardar Noticia';
                cargarNoticias();
            })
            .catch(err => {
                console.error('Error guardando:', err);
                mostrarToast('❌ Error al guardar. Intentá de nuevo.', true);
                btn.disabled = false;
                btn.textContent = '💾 Guardar Noticia';
            });
        }

        // ===== TOGGLE ACTIVA/INACTIVA =====
        function toggleNoticia(index) {
            fetch(JSONBIN_URL + '/latest', {
                headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
            })
            .then(res => res.json())
            .then(data => {
                const noticias = (data.record && data.record.noticias) ? data.record.noticias : [];
                if (!noticias[index]) return;
                noticias[index].activa = !noticias[index].activa;

                return fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify({ noticias: noticias })
                });
            })
            .then(res => res.json())
            .then(data => {
                mostrarToast('✅ Estado actualizado');
                cargarNoticias();
            })
            .catch(err => {
                console.error('Error actualizando:', err);
                mostrarToast('❌ Error al actualizar', true);
            });
        }

        // ===== ELIMINAR =====
        function eliminarNoticia(index) {
            if (!confirm('¿Seguro que querés eliminar esta noticia?')) return;
            fetch(JSONBIN_URL + '/latest', {
                headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
            })
            .then(res => res.json())
            .then(data => {
                const noticias = (data.record && data.record.noticias) ? data.record.noticias : [];
                noticias.splice(index, 1);

                return fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify({ noticias: noticias })
                });
            })
            .then(res => res.json())
            .then(data => {
                mostrarToast('🗑️ Noticia eliminada');
                cargarNoticias();
            })
            .catch(err => {
                console.error('Error eliminando:', err);
                mostrarToast('❌ Error al eliminar', true);
            });
        }

        // ===== UTILIDADES =====
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
